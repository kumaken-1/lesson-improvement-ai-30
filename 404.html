<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>ページが見つかりません｜生成AI 30のチャレンジⅢ ～授業改善～</title>
    <style>
      :root {
        color: #203047;
        background: #fffdf7;
        font-family: "BIZ UDPGothic", "Yu Gothic", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
      }

      main {
        width: min(100%, 38rem);
        padding: clamp(1.5rem, 5vw, 3rem);
        border: 1px solid #d8e0e5;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 8px 24px rgb(32 48 71 / 10%);
      }

      h1 {
        margin-block: 0 1rem;
        line-height: 1.4;
      }

      p {
        line-height: 1.8;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        margin-block-start: 0.5rem;
        padding: 0.65rem 1rem;
        border: 2px solid #203047;
        border-radius: 999px;
        color: #fff;
        background: #203047;
        font-weight: 700;
      }

      a:focus-visible {
        outline: 3px solid #005fcc;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>ページが見つかりませんでした</h1>
      <p>URLが変わったか、探している回がまだないようです。</p>
      <a href="./">「生成AI 30のチャレンジⅢ ～授業改善～」のトップへ戻る</a>
    </main>
  </body>
</html>
